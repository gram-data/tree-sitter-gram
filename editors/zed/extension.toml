id = "gram"
name = "Gram Language Support"
version = "0.6.0"
schema_version = 1
authors = ["Gram Data Contributors"]
description = "Support for Gram notation - composable data patterns"

capabilities = [
  { kind = "process:exec", command = "*", args = ["stdio"] },
  { kind = "download_file", host = "github.com", path = ["gram-data", "tree-sitter-gram", "**"] },
]

# path = "grammars/tree-sitter-gram"
[grammars.gram]
repository = "https://github.com/gram-data/tree-sitter-gram"
rev = "31e9d5c9bd733d58206f205a1fbd9572f07d4c59"

# Doc comments (`/** ... */`) in gram files are injected with gramdoc.
# Zed needs a full commit SHA here: v0.3.0 of gram-data/tree-sitter-gramdoc.
[grammars.gramdoc]
repository = "https://github.com/gram-data/tree-sitter-gramdoc"
rev = "4a1a4323e82ce3d72f1dfba71552dcf4966b52a8"
